      { UNI: "University of Campania (Vanvitelli)", Qs_rep_calc: 1.909307876, Censis_calc: 7.692307692, Nat_index_calc: 2.458009013, Qs_rank_calc: 21.12676056, THE_rank_calc: 0, SCORE_Q: 7.226694502, Corte_calc: 65.65008026, COL_calc: 69.33333333, QOL_calc: 2.746132033, city_size: 2, Non_EU_Seats: 50, COL_raw: 59.8, QOL_raw: 416.93, Corte_2025: 66.2, Corte_2023: 47.3 }
    ];

    let currentSort = { column: 'SCORE_Q', ascending: false };

    function formatNumber(num) {
      return typeof num === 'number' ? num.toFixed(1) : num;
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      data.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.onclick = () => toggleDetail(idx);

        tr.innerHTML = `
          <td class="uni-name">${row.UNI}</td>
          <td class="numeric">${formatNumber(row.SCORE_Q)}</td>
          <td class="numeric">${formatNumber(row.Corte_calc)}</td>
          <td class="numeric">${formatNumber(row.COL_calc)}</td>
          <td class="numeric">${formatNumber(row.QOL_calc)}</td>
          <td class="numeric">${row.Non_EU_Seats}</td>
        `;
        tbody.appendChild(tr);

        const detailRow = document.createElement('tr');
        detailRow.className = 'expanded-row';
        detailRow.id = `detail-${idx}`;

        detailRow.innerHTML = `
          <td colspan="6" class="detail-cell">
            <div class="detail-grid">
              <div class="detail-item">
                <span class="detail-label">QS Reputation</span>
                <span class="detail-value">${formatNumber(row.Qs_rep_calc)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">QS Rank</span>
                <span class="detail-value">${formatNumber(row.Qs_rank_calc)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">THE Rank</span>
                <span class="detail-value">${formatNumber(row.THE_rank_calc)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Censis Score</span>
                <span class="detail-value">${formatNumber(row.Censis_calc)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Nature Index</span>
                <span class="detail-value">${formatNumber(row.Nat_index_calc)}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Cost (€)</span>
                <span class="detail-value">${formatNumber(row.COL_calc)} | ${row.COL_raw}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">QoL Index</span>
                <span class="detail-value">${formatNumber(row.QOL_calc)} | ${row.QOL_raw}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Entry (2025/23)</span>
                <span class="detail-value">${formatNumber(100 - row.Corte_calc)} | ${row.Corte_2025 || row.Corte_2023}${row.Corte_2025 && row.Corte_2023 ? '/' + row.Corte_2023 : ''}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Non-EU Seats</span>
                <span class="detail-value">${row.Non_EU_Seats}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">City Size</span>
                <span class="detail-value">${row.city_size === 0 ? 'Small' : row.city_size === 1 ? 'Medium' : 'Large'}</span>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(detailRow);
      });

      updateSortIndicators();
    }

    function toggleDetail(idx) {
      const detail = document.getElementById(`detail-${idx}`);
      detail.classList.toggle('show');
    }

    function sortTable(column, isNumeric = false) {
      const ascending = currentSort.column === column ? !currentSort.ascending : false;

      const sorted = [...DATA].sort((a, b) => {
        const aVal = a[column];
        const bVal = b[column];

        if (isNumeric) {
          return ascending ? aVal - bVal : bVal - aVal;
        } else {
          return ascending
            ? String(aVal).localeCompare(String(bVal))
            : String(bVal).localeCompare(String(aVal));
        }
      });

      currentSort = { column, ascending };
      renderTable(sorted);
    }

    function updateSortIndicators() {
      document.querySelectorAll('th .sort-indicator').forEach((el, idx) => {
        el.textContent = '';
      });
      document.querySelectorAll('th').forEach((el) => {
        el.classList.remove('active');
      });

      const headers = document.querySelectorAll('th');
      const columnMap = {
        'UNI': 0,
        'SCORE_Q': 1,
        'Corte_calc': 2,
        'COL_calc': 3,
        'QOL_calc': 4,
        'Non_EU_Seats': 5
      };

      const idx = columnMap[currentSort.column];
      if (idx !== undefined) {
        headers[idx].classList.add('active');
        headers[idx].querySelector('.sort-indicator').textContent =
          currentSort.ascending ? '↑' : '↓';
      }
    }

    // Initial render
    renderTable(DATA);
  </script>
</body>
</html>
